---
name: 🐛 Bug Report
description: Submit a Bug Report
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to complete this bug report!
        This will help to find the cause of the issue faster and requires fewer follow-ups.
  - type: checkboxes
    attributes:
      label: Before Submitting Your Bug Report
      options:
        - label: I have verified that there isn't already an issue reporting the same bug to prevent duplication.
          required: false
        - label: I have read the Clipio README and known limitations.
          required: false
  - type: input
    attributes:
      label: Clipio Version / Commit (see 'About' window)
      placeholder: e.g. 2.6.1 or commit hash
    validations:
      required: false
  - type: input
    attributes:
      label: macOS Version
      placeholder: e.g. 14.7; Apple Silicon or Intel
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant settings / 相关设置
      description: Describe only relevant settings (such as paste by default). Do not attach full settings dumps, clipboard history, passwords, or tokens.
      render: Shell
    validations:
      required: false
  - type: textarea
    attributes:
      label: Description
      description: Please provide a clear and concise description of the bug.
      placeholder: Short description
    validations:
      required: false
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: |
        Provide the steps to consistently reproduce the issue. If possible, record a screen video
        demonstrating the problem using sample content. Redact private text, account names, and file paths.
      placeholder: |
        1. Navigate to …
        2. Click on …
        3. Scroll down to …
        4. Observe …
    validations:
      required: false
