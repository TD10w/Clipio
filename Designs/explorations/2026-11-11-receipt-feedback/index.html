<script>
const tray='<svg class="tray" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l2 4h4l2-4h4M4 9l-2 9h20l-2-9M12 2v7m-3-3 3 3 3-3"/></svg>';
const check='<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>';
const variants=[['a','A','轻弹','短促、克制 · 推荐'],['b','B','收进去','有接住东西的感觉'],['c','C','确认收好','明确显示成功与数量']];
const options=document.querySelector('#options');
variants.forEach(([id,letter,name,desc])=>{options.insertAdjacentHTML('beforeend',`<section class="option"><div class="meta"><span class="letter">${letter}</span><span class="name">${name}</span><span class="desc">${desc}</span></div><div class="scene ${id}" id="${id}"><div class="bar"><span>Clipio</span><span>⌘ ⇧ C</span></div><div class="notch"></div><div class="particle"></div><div class="pill">${tray}${check}<span class="hint">放入收集区</span></div><span class="state">等待收入</span><button class="replay" aria-label="播放${name}效果">体验 ${letter}</button></div></section>`);document.querySelector('#'+id+' button').addEventListener('click',()=>play([id]));});
const timers=new Map();
function animate(id){const scene=document.getElementById(id);(timers.get(id)||[]).forEach(clearTimeout);scene.classList.remove('active','confirm');scene.querySelector('.hint').textContent='放入收集区';scene.querySelector('.state').textContent='等待收入';void scene.offsetWidth;scene.classList.add('active');const count=document.querySelector('#count').value;scene.querySelector('.state').textContent=`已成功收入 ${count} 项`;
const callbacks=[];if(id==='b')callbacks.push(setTimeout(()=>scene.classList.add('confirm'),340));if(id==='c'){scene.classList.add('confirm');scene.querySelector('.hint').textContent=`已收好 · ${count} 项`;}
callbacks.push(setTimeout(()=>{scene.classList.remove('active','confirm');scene.querySelector('.hint').textContent='放入收集区';scene.querySelector('.state').textContent='等待收入';},id==='c'?1450:1000));timers.set(id,callbacks);}
function play(ids){ids.forEach(animate);const audio=document.querySelector('#audio');audio.pause();audio.currentTime=0;const status=document.querySelector('#audioStatus');status.textContent='';if(document.querySelector('#sound').checked){audio.play().catch(()=>{status.textContent='此预览窗口未能播放声音，可打开下方 HTML 文件体验完整音效。';});}}
document.querySelector('#playAll').addEventListener('click',()=>play(['a','b','c']));
