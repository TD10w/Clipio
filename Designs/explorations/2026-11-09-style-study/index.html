<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipio Apple 27 颜色与字体试排</title>
<style>
:root { color-scheme: light dark; }
html, body { margin: 0; background: transparent; }
body { font-family: var(--font-sans, system-ui, sans-serif); color: var(--foreground, CanvasText); }
#clipio-style-study { display: grid; gap: 22px; }
#clipio-style-study * { box-sizing: border-box; }
#clipio-style-study .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; }
#clipio-style-study label { display: grid; gap: 8px; }
#clipio-style-study select, #clipio-style-study button { font: inherit; color: inherit; }
#clipio-style-study select { max-width: 100%; min-height: 38px; }
#clipio-style-study .palette { display: flex; gap: 8px; flex-wrap: wrap; }
#clipio-style-study .palette button { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: var(--card, Canvas); border: 1px solid var(--border, GrayText); border-radius: var(--radius, 12px); }
#clipio-style-study .palette button[aria-pressed="true"] { background: var(--secondary, ButtonFace); outline: 2px solid var(--ring, Highlight); }
#clipio-style-study .swatch { display: inline-block; width: 20px; height: 20px; border-radius: 50%; }
#clipio-style-study .section-label { font-weight: 500; }
#clipio-style-study .secondary { color: var(--muted-foreground, GrayText); }
#clipio-style-study .sample { max-width: 672px; border-left: 4px solid var(--study-accent);
  border-radius: var(--radius, 12px); overflow: hidden; background: var(--study-surface); }
#clipio-style-study .native-image { display: block; width: 100%; max-width: 640px; height: auto; }
#clipio-style-study figure { margin: 0; display: grid; gap: 10px; }
#clipio-style-study .icon-sizes { display: flex; align-items: center; flex-wrap: wrap; gap: 24px; }
#clipio-style-study .icon-size { display: grid; justify-items: center; gap: 6px; }
#clipio-style-study .icon-size img { display: block; }
#clipio-style-study .details { display: grid; gap: 10px; }
#clipio-style-study .symbol-sample { max-width: 640px; border-radius: var(--radius, 12px); overflow: hidden; }
@media (pointer: coarse) { #clipio-style-study select, #clipio-style-study button { min-height: 44px; } }
@media (max-width: 500px) { #clipio-style-study .native-image { max-width: 320px; }
  #clipio-style-study .sample, #clipio-style-study .symbol-sample { max-width: 324px; }
  #clipio-style-study .controls { display: grid; grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="clipio-style-study" aria-label="Clipio 颜色与字体候选">
  <div class="controls">
    <label>字体试排
      <select id="study-font">
        <option value="standard">系统标准 · SF Pro ＋ 苹方</option>
        <option value="rounded">系统圆体 · SF Pro Rounded ＋ 苹方</option>
        <option value="serif">系统衬线 · New York ＋ 宋体</option>
      </select>
    </label>
    <label>外观
      <select id="study-mode"><option value="dark">深色</option><option value="light">浅色</option></select>
    </label>
  </div>
  <div class="details">
    <div class="section-label">品牌色候选 · macOS 27.2 系统色取样</div>
    <div class="palette" role="group" aria-label="颜色方向">
      <button type="button" data-color="blue" aria-pressed="true"><span class="swatch" aria-hidden="true"></span>系统蓝</button>
      <button type="button" data-color="teal" aria-pressed="false"><span class="swatch" aria-hidden="true"></span>青绿</button>
      <button type="button" data-color="orange" aria-pressed="false"><span class="swatch" aria-hidden="true"></span>暖橙</button>
    </div>
    <div id="study-color-status" class="secondary" aria-live="polite"></div>
  </div>
  <figure>
    <div class="sample"><img id="study-font-image" class="native-image" alt="Clipio 字体试排，包含字标、中英文正文与文件元信息"></div>
    <figcaption class="secondary">字标 17 pt · 正文 13 pt · 元信息 11.5 pt · Mac 原生渲染</figcaption>
  </figure>
  <figure>
    <figcaption class="section-label">界面图标 · SF Symbols</figcaption>
    <div class="symbol-sample"><img id="study-symbol-image" class="native-image" alt="搜索、固定、清空、设置、剪贴板、纸夹、暂存和更多操作的 SF Symbols 参考"></div>
  </figure>
  <figure>
    <figcaption class="section-label">现有应用图标 · 小尺寸识别</figcaption>
    <div class="icon-sizes">
      <div class="icon-size"><img id="study-icon-64" width="64" height="64" alt="现有香蕉装小马图标，64 点"><span class="secondary">64 pt</span></div>
      <div class="icon-size"><img id="study-icon-32" width="32" height="32" alt="现有香蕉装小马图标，32 点"><span class="secondary">32 pt</span></div>
      <div class="icon-size"><img id="study-icon-16" width="16" height="16" alt="现有香蕉装小马图标，16 点"><span class="secondary">16 pt</span></div>
    </div>
  </figure>
</main>

const root = document.getElementById('clipio-style-study');
const fontPicker = document.getElementById('study-font');
const modePicker = document.getElementById('study-mode');
const colorLabels = { blue: '系统蓝', teal: '青绿', orange: '暖橙' };
let selectedColor = 'blue';
modePicker.value = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
function renderStudy() {
  const mode = modePicker.value;
  const width = matchMedia('(max-width: 500px)').matches ? 320 : 640;
  const palette = studyData.palette[mode];
  root.style.setProperty('--study-surface', palette.surface);
  root.style.setProperty('--study-accent', palette[selectedColor]);
  document.getElementById('study-font-image').src = studyData.images[`font-${fontPicker.value}-${mode}-${width}.png`];
  document.getElementById('study-symbol-image').src = studyData.images[`symbols-${mode}-${width}.png`];
  root.querySelectorAll('[data-color]').forEach(button => {
    const color = button.dataset.color;
    button.setAttribute('aria-pressed', String(color === selectedColor));
    button.querySelector('.swatch').style.backgroundColor = palette[color];
  });
  document.getElementById('study-color-status').textContent = `${colorLabels[selectedColor]} · ${palette[selectedColor]}`;
}
fontPicker.addEventListener('change', renderStudy);
modePicker.addEventListener('change', renderStudy);
root.querySelectorAll('[data-color]').forEach(button => button.addEventListener('click', () => {
  selectedColor = button.dataset.color;
  renderStudy();
}));
addEventListener('resize', renderStudy);
for (const size of [64, 32, 16]) document.getElementById(`study-icon-${size}`).src = studyData.icons[size];
renderStudy();
</script>
