<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clipio · 收藏与清空菜单讨论稿</title>
<style>
:root{color-scheme:light dark;--foreground:#eef0f4;--muted:#a5a9b2;--border:#ffffff25;--card:#20232b;--primary:#9fc8ff;--radius:18px;--font-sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:var(--foreground);font:13px/1.5 var(--font-sans)}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:3px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.tools button{border:1px solid var(--border);border-radius:8px;background:var(--card);padding:6px 10px}.tools span{font-size:11px;color:var(--muted);margin-left:auto}.stage{position:relative;min-height:364px;padding:25px 12px 80px;border:1px solid var(--border);border-radius:var(--radius);isolation:isolate;background:radial-gradient(ellipse at 10% 110%,#b5978f,transparent 65%),radial-gradient(ellipse at 90% 90%,#587f9c,transparent 70%),#3b455d;overflow:hidden}.shelf{position:relative;border:1px solid #ffffff90;border-radius:25px;background:linear-gradient(125deg,#eff1fc33,#ffffff13);box-shadow:inset 0 1px 0 #ffffff60,0 12px 24px #0c0f2233;backdrop-filter:blur(20px);padding:10px 11px 12px;color:#f4f5fa}.toolbar{display:flex;align-items:center;gap:7px;min-width:0}.brand{font-size:15px;font-weight:600;letter-spacing:-.5px;margin-right:2px}.icon{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #ffffff20;border-radius:50%;background:#1c2b3b4d}.icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}.mode{background:none;border:none;width:23px}.segmented{display:flex;gap:2px;background:#10172244;border:1px solid #ffffff20;padding:2px;border-radius:8px;flex-shrink:0}.segmented button{border:0;background:none;color:#ffffffa8;padding:2px 9px;font-size:11px;border-radius:5px}.segmented button[aria-pressed=true]{background:#ffffff32;color:#fff;box-shadow:0 1px 3px #0003}.search{height:29px;display:flex;align-items:center;gap:5px;background:#18263d77;border-radius:20px;padding:0 9px;min-width:40px;flex:1;color:#c6cbd5}.search input{width:100%;min-width:0;background:none;border:0;color:#fff;outline:none;font-size:11px}.search input::placeholder{color:#c6cbd5}.cards{display:flex;gap:10px;overflow:auto;padding:12px 1px 1px;min-height:143px;scrollbar-width:thin;scrollbar-color:#ffffff25 transparent}.clip{position:relative;flex:0 0 132px;height:130px;border:1px solid #ffffff35;border-radius:20px;background:#14203440;padding:12px 10px 22px;box-shadow:inset 0 1px 0 #fff1}.clip h3{font-size:11px;font-weight:500;margin:8px 18px 7px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clip p{font-size:11px;line-height:1.4;margin:0;color:#edf1f5;overflow-wrap:anywhere}.star{position:absolute;top:8px;right:8px;border:0;background:none;font-size:16px;line-height:1;color:#c8ced6;padding:2px}.star.on{color:#ffe29b}.footnote{position:absolute;bottom:7px;left:10px;font-size:9px;color:#c9cbd3}.picture{height:54px;margin:5px 0;background:linear-gradient(130deg,#9fb6a6,#7f9b9e);border-radius:8px;display:flex;align-items:center;justify-content:center}.picture svg{width:45px;height:45px;fill:#e3ece5aa}.empty{width:100%;padding:40px 0;text-align:center;color:#cbd0da;font-size:12px}.menu{position:absolute;top:44px;right:70px;z-index:3;width:229px;padding:5px;background:#24272df5;border:1px solid #ffffff38;border-radius:10px;box-shadow:0 12px 35px #0006;color:#f5f6f8;backdrop-filter:blur(18px)}.menu button{width:100%;display:block;text-align:left;padding:8px 10px;background:none;border:0;border-radius:6px}.menu button:hover{background:#ffffff16}.menu strong{display:block;font-size:12px;font-weight:500}.menu small{display:block;font-size:10px;color:#b6b9c3;margin-top:2px}.menu .danger strong{color:#ffaaa3}.divider{height:1px;background:#ffffff19;margin:4px 6px}.status{position:absolute;bottom:22px;left:22px;right:22px;font-size:11px;color:#e3e9f3;min-height:17px}.modal{position:absolute;inset:0;z-index:5;background:#0b101e80;display:grid;place-items:center;padding:16px}.dialog{width:310px;max-width:100%;background:#30333b;border:1px solid #ffffff40;box-shadow:0 18px 40px #0007;border-radius:17px;padding:22px;text-align:center}.dialog h2{font-size:15px;margin:0 0 9px}.dialog p{font-size:12px;color:#c9cbd3;margin:0 0 18px}.actions{display:flex;gap:7px}.actions button{flex:1;border:1px solid #ffffff30;border-radius:7px;padding:7px;background:#ffffff16}.actions .destructive{background:#d54e45;border-color:transparent;color:white}.caption{margin:10px 0 0;color:var(--muted);font-size:12px}.guide{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.note{padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:12px}.note b{display:block;font-weight:600;margin-bottom:4px}.note p{margin:0;color:var(--muted)}@media(max-width:540px){.brand{display:none}.toolbar{gap:5px}.shelf{padding:9px}.stage{padding:18px 7px 80px}.segmented button{padding:2px 6px}.search{padding:0 6px}.icon{width:25px;height:25px}.menu{right:58px}.guide{grid-template-columns:1fr}.tools span{margin-left:0;width:100%}.clip{flex-basis:127px}}
#filterStar[aria-pressed=true] svg{fill:#ffe09a;stroke:#ffe09a}#filterStar:hover{background:#ffffff15}.segmented{display:none}</style>
<div class="tools"><button id="newCopy">模拟在其他 App 复制</button><button id="reopen">模拟重新打开</button><button id="reset">重置示例</button><span id="next">下次打开：全部</span></div>
<div class="stage">
<div class="shelf">
<div class="toolbar"><span class="brand">Clipio</span><button class="icon mode" aria-label="剪贴板，示意按钮" title="原有剪贴板 / 收集区切换"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V3h6v2"/></svg></button>
<button class="icon mode" id="filterStar" aria-label="只看收藏（Shift+Tab）" aria-pressed="false" title="只看收藏（Shift+Tab）"><svg viewBox="0 0 24 24"><path d="m12 2.5 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg></button>
<label class="search"><span aria-hidden="true">⌕</span><input id="search" placeholder="搜索…" aria-label="搜索剪贴板示例"></label>
<button class="icon" id="trash" aria-haspopup="menu" aria-expanded="false" aria-label="清空菜单" title="清空菜单"><svg viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg></button>
<button class="icon" aria-label="原有设置按钮，示意" title="原有设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3 3-1 3 1 1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3-3 1z"/></svg></button>
<button class="icon" aria-label="原有退出按钮，示意" title="原有退出"><svg viewBox="0 0 24 24"><path d="M12 3v9M7 5a8 8 0 1 0 10 0"/></svg></button></div>
<div class="cards" id="cards"></div>
<div class="menu" id="clearMenu" hidden role="menu" aria-label="清空选项"><button id="clearHistory" role="menuitem"><strong>清空历史</strong><small>保留所有收藏</small></button><div class="divider"></div><button id="clearAll" class="danger" role="menuitem"><strong>清空全部（含收藏）</strong><small>会再次确认</small></button></div>
</div>
<div class="status" id="status" role="status" aria-live="polite">点搜索框左侧的空心星标，只看收藏；再点一次显示全部。也可按 Shift+Tab。</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogBody"><div class="dialog"><h2 id="dialogTitle"></h2><p id="dialogBody"></p><div class="actions"><button id="cancel">取消</button><button class="destructive" id="confirm">清空</button></div></div></div>
</div>
<div class="guide"><div class="note"><b>一个星标切换范围</b><p>空心：全部。金色实心：只看收藏。没有文字分段按钮；垃圾桶沿用原菜单。</p></div><div class="note"><b>收窄自动切换</b><p>新复制后，下次回全部并清旧搜索。其他时候记住手动选择；点 Star 不改页面。</p></div></div>
<p class="caption">交互讨论稿，参照现有 Clipio 布局。所有清空操作只影响这里的示例，未改动 App 或你的数据。只用于确认图标切换感觉。</p>
<script>
const initial=[{id:1,name:'个人网站',value:'https://example.com',star:true},{id:2,name:'LinkedIn',value:'https://linkedin.com/in/example',star:true},{id:3,name:'刚复制的介绍',value:'你好，我是一名创作者。',star:false},{id:4,name:'常用头像',picture:true,star:true},{id:5,name:'一段临时文字',value:'明天下午三点见。',star:false}];
let items=structuredClone(initial),filter='all',preferred='all',clearSearchOnOpen=false,pending=null;
const $=s=>document.querySelector(s);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=$('#search').value.toLowerCase();const visible=items.filter(x=>(filter==='all'||x.star)&&(x.name+' '+(x.value||'')).toLowerCase().includes(q));$('#filterStar').setAttribute('aria-pressed',filter==='favorites');$('#filterStar').title=(filter==='all'?'只看收藏':'显示全部')+'（Shift+Tab）';$('#filterStar').setAttribute('aria-label',$('#filterStar').title);$('#next').textContent='下次打开：'+(preferred==='all'?'全部':'收藏');$('#cards').innerHTML=visible.map(x=>`<article class="clip"><button class="star ${x.star?'on':''}" data-id="${x.id}" aria-label="${x.star?'取消收藏':'收藏'}${escape(x.name)}">${x.star?'★':'☆'}</button><h3>${escape(x.name)}</h3>${x.picture?'<div class="picture"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="17" r="9"/><path d="M7 44c0-17 34-17 34 0z"/></svg></div>':`<p>${escape(x.value)}</p>`}<span class="footnote">${x.star?'已收藏':'剪贴板'}</span></article>`).join('')||'<div class="empty">'+(q?'没有匹配内容':filter==='favorites'?'还没有收藏':'暂无历史')+'</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const x=items.find(x=>x.id===Number(b.dataset.id));x.star=!x.star;render();$('#status').textContent=x.star?'已收藏，当前范围和下次打开范围均不自动变化。':'已取消收藏，条目仍在普通历史中。';});}
function menu(open){$('#clearMenu').hidden=!open;$('#trash').setAttribute('aria-expanded',open);}
$('#trash').onclick=()=>menu($('#clearMenu').hidden);function toggleFilter(){filter=preferred=filter==='all'?'favorites':'all';clearSearchOnOpen=false;menu(false);render();$('#status').textContent=filter==='favorites'?'星标点亮：只看收藏。再次点击回到全部。':'星标空心：显示全部。Shift+Tab 也能切换。';}$('#filterStar').onclick=toggleFilter;$('#search').oninput=render;
function request(kind){menu(false);pending=kind;const normal=items.filter(x=>!x.star).length,stars=items.filter(x=>x.star).length;$('#dialogTitle').textContent=kind==='all'?'清空全部内容？':'清空普通历史？';$('#dialogBody').textContent=kind==='all'?`将删除 ${normal} 条普通历史和 ${stars} 项收藏，无法撤销。`:`将删除 ${normal} 条普通历史，保留 ${stars} 项收藏。`;$('#modal').hidden=false;$('#cancel').focus();}
$('#clearHistory').onclick=()=>request('history');$('#clearAll').onclick=()=>request('all');$('#cancel').onclick=()=>{$('#modal').hidden=true;$('#trash').focus();};$('#confirm').onclick=()=>{items=pending==='all'?[]:items.filter(x=>x.star);$('#modal').hidden=true;render();$('#status').textContent=pending==='all'?'示例已全部清空。点击“重置示例”可恢复。':'普通历史已清空，收藏保留。';$('#trash').focus();};
$('#newCopy').onclick=()=>{items.unshift({id:Date.now(),name:'新复制内容',value:'这是一条刚复制的示例。',star:false});preferred='all';clearSearchOnOpen=true;menu(false);render();$('#status').textContent='有新复制：当前页面不跳；下次打开回“全部”并清空旧搜索。';};$('#reopen').onclick=()=>{filter=preferred;if(clearSearchOnOpen)$('#search').value='';clearSearchOnOpen=false;menu(false);render();$('#status').textContent='已模拟重新打开：'+(filter==='all'?'全部':'收藏')+'。';};$('#reset').onclick=()=>{items=structuredClone(initial);filter=preferred='all';clearSearchOnOpen=false;$('#search').value='';$('#modal').hidden=true;menu(true);render();$('#status').textContent='示例已恢复，可以继续尝试。';};document.addEventListener('keydown',e=>{if(e.key==='Tab'&&e.shiftKey&&!e.metaKey&&!e.altKey&&!e.ctrlKey&&!e.isComposing&&$('#modal').hidden){e.preventDefault();toggleFilter();return;}if(e.key==='Escape'){if(!$('#modal').hidden){$('#modal').hidden=true;$('#trash').focus();}else menu(false);}});document.addEventListener('click',e=>{if(!e.target.closest('#trash')&&!e.target.closest('#clearMenu'))menu(false);});render();
</script></html>
